<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ספר המתכונים שלנו</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdf6ec;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .hidden { display: none !important; }
    h1 { color: #8a4b1f; }
    input {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin-top: 12px;
      padding: 12px 28px;
      font-size: 16px;
      background: #c2662d;
      color: white;
      border: none;
      border-radius: 8px;
    }
    button:disabled { background: #7a9a6b; }

    /* רשימת המתכונים השמורים */
    #savedSection { max-width: 600px; margin: 32px auto 0; text-align: right; }
    #savedSection h2 { color: #8a4b1f; }
    .saved-item {
      background: white;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .saved-item .name { font-weight: bold; color: #8a4b1f; }
    .saved-item .by { color: #777; font-size: 14px; }
    .empty { color: #777; }

    /* דף המתכון */
    #recipeScreen { max-width: 600px; margin: 0 auto; }
    .back {
      display: block;
      margin: 0 0 12px 0;
      background: transparent;
      color: #8a4b1f;
      border: 1px solid #8a4b1f;
      padding: 8px 16px;
    }
    #recipe {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: right;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #recipe h2 { color: #8a4b1f; margin-top: 0; }
    .author { color: #777; margin-bottom: 8px; }
    .source { margin-bottom: 16px; }
    .source a { color: #c2662d; font-weight: bold; }
    .gallery { display: flex; gap: 8px; overflow-x: auto; }
    .gallery img { height: 150px; border-radius: 8px; cursor: pointer; }
    li { margin-bottom: 8px; line-height: 1.5; }
    #saveBtn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
    }

    /* חלון האישור */
    #confirmModal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .modal-box h3 { margin-top: 0; color: #8a4b1f; }
    .modal-box button { display: block; width: 100%; }
    .danger { background: #b3402a; }
    .secondary { background: #8a4b1f; }

    /* גלריה מוגדלת */
    #lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #lightbox.open { display: flex; }
    #lightboxImg { max-width: 92%; max-height: 85%; border-radius: 8px; }
    .lb-btn {
      position: absolute;
      margin: 0;
      padding: 0;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 32px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      line-height: 52px;
    }
    #lbPrev { right: 12px; top: 50%; margin-top: -26px; }
    #lbNext { left: 12px; top: 50%; margin-top: -26px; }
    #lbClose { right: 12px; top: 12px; }
    #lbCounter { position: absolute; bottom: 16px; color: white; font-size: 16px; }
  </style>
</head>
<body>

  <!-- דף ראשון -->
  <div id="homeScreen">
    <h1>ספר המתכונים שלנו</h1>
    <p>הדבק כאן קישור למתכון:</p>
    <input id="linkInput" type="text" placeholder="https://...">
    <br>
    <button id="createBtn">צור מתכון</button>

    <div id="savedSection">
      <h2>המתכונים שלי</h2>
      <div id="savedList"></div>
    </div>
  </div>

  <!-- דף מתכון -->
  <div id="recipeScreen" class="hidden">
    <button class="back" id="backBtn">→ חזרה</button>
    <div id="recipe"></div>
    <button id="saveBtn">שמור בספר המתכונים שלי</button>
  </div>

  <!-- חלון אישור חזרה -->
  <div id="confirmModal" class="hidden">
    <div class="modal-box">
      <h3>לחזור לדף הראשי?</h3>
      <p>המתכון עוד לא נשמר. אם תחזור, הוא יבוטל.</p>
      <button class="danger" id="confirmLeave">חזרה וביטול המתכון</button>
      <button class="secondary" id="confirmStay">המשך צפייה</button>
    </div>
  </div>

  <!-- גלריה מוגדלת -->
  <div id="lightbox">
    <button class="lb-btn" id="lbClose">×</button>
    <button class="lb-btn" id="lbPrev">›</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lb-btn" id="lbNext">‹</button>
    <div id="lbCounter"></div>
  </div>

  <script>
    // מתכון לדוגמה. בהמשך הנתונים האלה יגיעו מקישור אמיתי
    const sampleRecipe = {
      title: "שקשוקה קלאסית",
      author: "דנה כהן",
      sourceUrl: "https://example.com/shakshuka",
      ingredients: [
        { name: "ביצים", amount: "4" },
        { name: "עגבניות בשלות", amount: "6" },
        { name: "בצל", amount: "1" },
        { name: "שום", amount: "3 שיניים" },
        { name: "שמן זית", amount: "3 כפות" },
        { name: "פפריקה", amount: "1 כפית" }
      ],
      steps: [
        "מטגנים את הבצל והשום בשמן זית עד שהם מזהיבים.",
        "מוסיפים את העגבניות הקצוצות והפפריקה ומבשלים 15 דקות.",
        "יוצרים גומחות ברוטב ושוברים לתוכן את הביצים.",
        "מכסים ומבשלים עוד 5 דקות, עד שהביצים מוכנות."
      ],
      images: [
        "https://picsum.photos/id/292/900/600",
        "https://picsum.photos/id/312/900/600",
        "https://picsum.photos/id/326/900/600"
      ]
    };

    // ----- אלמנטים שנשתמש בהם -----
    const homeScreen = document.getElementById("homeScreen");
    const recipeScreen = document.getElementById("recipeScreen");
    const confirmModal = document.getElementById("confirmModal");
    const saveBtn = document.getElementById("saveBtn");

    // ----- מצב האפליקציה (מה שהאפליקציה "זוכרת" כרגע) -----
    let currentRecipe = null;
    let currentIsSaved = false;
    let currentImages = [];
    let currentIndex = 0;

    // ----- שמירה וקריאה מהזיכרון של הדפדפן -----
    function getSaved() {
      return JSON.parse(localStorage.getItem("myRecipes") || "[]");
    }
    function setSaved(list) {
      localStorage.setItem("myRecipes", JSON.stringify(list));
    }
    function isAlreadySaved(recipe) {
      return getSaved().some(function (r) { return r.sourceUrl === recipe.sourceUrl; });
    }

    // ----- מעבר בין דפים -----
    function showScreen(name) {
      homeScreen.classList.toggle("hidden", name !== "home");
      recipeScreen.classList.toggle("hidden", name !== "recipe");
      window.scrollTo(0, 0);
    }

    function openRecipe(recipe, alreadySaved) {
      currentRecipe = recipe;
      currentIsSaved = alreadySaved;
      showRecipe(recipe);
      updateSaveButton();
      showScreen("recipe");
    }

    function goHome() {
      confirmModal.classList.add("hidden");
      renderSavedList();
      showScreen("home");
    }

    function updateSaveButton() {
      saveBtn.disabled = currentIsSaved;
      saveBtn.textContent = currentIsSaved
        ? "✓ המתכון שמור בספר שלך"
        : "שמור בספר המתכונים שלי";
    }

    // ----- רשימת המתכונים השמורים -----
    function renderSavedList() {
      const list = getSaved();
      const box = document.getElementById("savedList");
      if (list.length === 0) {
        box.innerHTML = "<p class='empty'>עוד לא שמרת מתכונים.</p>";
        return;
      }
      let html = "";
      for (let i = 0; i < list.length; i++) {
        html += "<div class='saved-item' data-i='" + i + "'>" +
                "<div class='name'>" + list[i].title + "</div>" +
                "<div class='by'>מאת: " + list[i].author + "</div></div>";
      }
      box.innerHTML = html;
    }

    document.getElementById("savedList").addEventListener("click", function (e) {
      const item = e.target.closest(".saved-item");
      if (!item) return;
      const recipe = getSaved()[Number(item.dataset.i)];
      openRecipe(recipe, true);
    });

    // ----- בניית תצוגת המתכון -----
    function showRecipe(recipe) {
      currentImages = recipe.images;

      let html = "<h2>" + recipe.title + "</h2>";
      html += "<div class='author'>מאת: " + recipe.author + "</div>";
      html += "<div class='source'><a href='" + recipe.sourceUrl +
              "' target='_blank' rel='noopener'>למתכון המקורי ←</a></div>";

      if (recipe.images.length > 0) {
        html += "<div class='gallery'>";
        for (let i = 0; i < recipe.images.length; i++) {
          html += "<img src='" + recipe.images[i] + "' data-index='" + i + "'>";
        }
        html += "</div>";
      }

      html += "<h3>מצרכים</h3><ul>";
      for (const item of recipe.ingredients) {
        html += "<li>" + item.amount + " - " + item.name + "</li>";
      }
      html += "</ul>";

      html += "<h3>אופן הכנה</h3><ol>";
      for (const step of recipe.steps) {
        html += "<li>" + step + "</li>";
      }
      html += "</ol>";

      document.getElementById("recipe").innerHTML = html;
    }

    // ----- כפתורים -----
    document.getElementById("createBtn").addEventListener("click", function () {
      openRecipe(sampleRecipe, isAlreadySaved(sampleRecipe));
    });

    document.getElementById("backBtn").addEventListener("click", function () {
      if (currentIsSaved) {
        goHome();
      } else {
        confirmModal.classList.remove("hidden");
      }
    });

    document.getElementById("confirmLeave").addEventListener("click", goHome);
    document.getElementById("confirmStay").addEventListener("click", function () {
      confirmModal.classList.add("hidden");
    });

    saveBtn.addEventListener("click", function () {
      const list = getSaved();
      list.push(currentRecipe);
      setSaved(list);
      currentIsSaved = true;
      updateSaveButton();
    });

    // ----- הגלריה המוגדלת -----
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lbCounter = document.getElementById("lbCounter");

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add("open");
    }
    function closeLightbox() { lightbox.classList.remove("open"); }
    function updateLightbox() {
      lightboxImg.src = currentImages[currentIndex];
      lbCounter.textContent = (currentIndex + 1) + " / " + currentImages.length;
    }
    function nextImage() {
      currentIndex = (currentIndex + 1) % currentImages.length;
      updateLightbox();
    }
    function prevImage() {
      currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
      updateLightbox();
    }

    document.getElementById("recipe").addEventListener("click", function (e) {
      if (e.target.tagName === "IMG") {
        openLightbox(Number(e.target.dataset.index));
      }
    });
    document.getElementById("lbNext").addEventListener("click", nextImage);
    document.getElementById("lbPrev").addEventListener("click", prevImage);
    document.getElementById("lbClose").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", function (e) {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") nextImage();
      if (e.key === "ArrowRight") prevImage();
    });

    let touchStartX = 0;
