<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ספר המתכונים שלנו</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdf6ec;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #8a4b1f;
    }
    input {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin-top: 12px;
      padding: 12px 28px;
      font-size: 16px;
      background: #c2662d;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>ספר המתכונים שלנו</h1>
  <p>הדבק כאן קישור למתכון:</p>
  <input type="text" placeholder="https://...">
  <br>
  <button>צור מתכון</button>
</body>
</html>
